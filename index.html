<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practicando con APIs</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <main class="contenedor">
        <section class="bloque-api">
            <h1>Personaje de Rick and Morty</h1>
            <button id="btnPersonaje" type="button">Buscar personaje</button>
            <div id="resultado"></div>
        </section>

        <hr>

        <section class="bloque-api" id="usuario">
            <h1>Informacion del usuario</h1>
            <p><strong>Nombre:</strong> <span id="nombreUsuario"></span></p>
            <p><strong>Correo:</strong> <span id="emailUsuario"></span></p>
            <p><strong>Telefono:</strong> <span id="telefonoUsuario"></span></p>
        </section>

        <hr>

        <section class="bloque-api">
            <h1>Frase del dia</h1>
            <button id="btnFrase" type="button">Crear frase</button>
            <div id="fraseResultado"></div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
